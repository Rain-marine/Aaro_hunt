<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Hunt</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      background: #0b0b0b;
      color: #f3ede4;

      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }


    /* MAIN BACKGROUND GLOW */

    #backgroundGlow {
      position: fixed;

      width: 600px;
      height: 600px;

      border-radius: 50%;

      background: radial-gradient(
        circle,
        rgba(255, 205, 125, 0.32) 0%,
        rgba(255, 155, 65, 0.18) 23%,
        rgba(255, 95, 30, 0.08) 45%,
        rgba(180, 50, 20, 0.025) 60%,
        transparent 74%
      );

      filter: blur(28px);

      opacity: 0.6;

      left: 50%;
      top: 50%;

      transform-origin: center;

      pointer-events: none;

      z-index: 0;

      transition:
        opacity 0.2s ease,
        transform 0.25s ease,
        left 0.3s ease,
        top 0.3s ease;
    }


    /* SECOND BACKGROUND GLOW */

    #backgroundGlow2 {
      position: fixed;

      width: 380px;
      height: 420px;

      border-radius: 50%;

      background: radial-gradient(
        circle,
        rgba(255, 178, 80, 0.18) 0%,
        rgba(255, 90, 40, 0.07) 40%,
        transparent 72%
      );

      filter: blur(34px);

      opacity: 0.35;

      left: 50%;
      top: 52%;

      transform: translate(-50%, -50%);

      pointer-events: none;

      z-index: 0;

      transition:
        opacity 0.25s ease,
        transform 0.3s ease,
        left 0.3s ease,
        top 0.3s ease;
    }
